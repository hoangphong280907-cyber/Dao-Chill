  else if(a==="claim"){const q=QS[S.qi];if(!q||S.st[q.s]<q.n)return;S.coins+=q.r.c||0;S.wood+=q.r.w||0;S.stone+=q.r.s||0;S.qi++;toast("+ Nhiệm vụ hoàn thành!");burst('🎇')}
  else if(a==="snd"){S.snd=!S.snd;if(!S.snd)rainSnd(false)}
  else if(a==="reset"){const n=Date.now();if(n>rsAt){rsAt=n+4000;return toast("⚠️ Bấm 'Chơi lại' lần nữa trong 4 giây để xóa toàn bộ")}rsAt=0;S=def();fixS();sel=[];bk=null;hr=null;hs=null;fz={ph:"idle"};chest=null;toast("Đã bắt đầu lại")}
  save();render();
});

function tick(){if(!inGame)return;
  passive(false);
  amb();penTick();const nw=Date.now(),dtm=nw-wl;wl=nw;const ws=WX[W.t].s;if(ws!==1)S.plots.forEach(p=>{if(p)p.at-=dtm*(ws-1)});S.trees.forEach(t=>{if(t)t.at-=dtm*(ws-1)});
  if(nw>W.u){const p=W.t==="rain"&&Math.random()<.45?"rainbow":pickW();if(p!==W.t||!W.u){W.t=p;toast(WX[p].e+" "+WX[p].n+WX[p].d);wxFx()}W.u=nw+45000+Math.random()*45000}
  evTick(nw);evTick2(nw);checkAch();if(chest&&nw>chest.u)chest=null;else if(!chest&&Math.random()<.0035*(S.inv.magnet>0?1.5:1))chest={p:CPOS[Math.floor(Math.random()*CPOS.length)],u:nw+75000,t:rt3()};
  if(S.guest&&Date.now()>S.guest.until)S.guest=null;else if(!S.guest&&Math.random()<(W.t==="rainbow"?.06:.02)){const ks=Object.keys(V).filter(x=>x==="egg"||x==="wool"||x==="milk"||(C[x]&&!C[x].r&&(!C[x].u||C[x].u())));const it=ks[Math.floor(Math.random()*ks.length)],n=2+Math.floor(Math.random()*3);S.guest={e:GE[Math.floor(Math.random()*GE.length)],it,n,p:Math.ceil(V[it]*n*1.5*(1+.15*pk('liv'))*(1+.05*tb('ora'))*(S.outfit&&S.outfit.outfit==='kimono'?1.05:1)*(tetHas('couplet')?1.05:1)),until:Date.now()+90000}}
  hud();
  document.querySelectorAll("[data-pi]").forEach(e=>{const p=S.plots[e.dataset.pi];if(p)e.style.width=Math.min(100,(Date.now()-p.at)/gt(p.c)*100)+"%"});
  if(mkSig()!==sig)render();
}
{const td=new Date().toDateString();if(inGame&&S.dl!==td){S.ds=S.dl===new Date(Date.now()-864e5).toDateString()?S.ds+1:1;const b=20+10*Math.min(S.ds,5);S.coins+=b;S.dl=td;setTimeout(()=>toast("+"+b+" xu quà hằng ngày (chuỗi "+S.ds+" ngày)"),600)}}
passive(true);render();
setInterval(tick,1000);setInterval(fup,80);requestAnimationFrame(fxLoop);
setInterval(save,5000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){passive(true);render()}else save()});
</script>
